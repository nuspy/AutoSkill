name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: autoskill, POSTGRES_PASSWORD: autoskill, POSTGRES_DB: autoskill }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U autoskill" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "backend[dev]"
      - run: ruff check backend/autoskill backend/tests
      - run: python -m pytest -q backend
      - name: Migrations on Postgres (upgrade head, downgrade base, upgrade head)
        working-directory: backend
        env:
          AUTOSKILL_DATABASE_URL: postgresql+asyncpg://autoskill:autoskill@localhost:5432/autoskill
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head

  local-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "packages/autoskill-local[dev]"
      - run: ruff check packages/autoskill-local
      - run: python -m pytest -q packages/autoskill-local/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run i18n:check
        working-directory: frontend
      - run: npm test -- --run
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
