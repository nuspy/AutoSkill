[project]
name = "autoskill-local"
version = "0.1.0"
description = "AutoSkill user-side CLI and companion MCP server: install, trial and report skills on your own agent"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "pyyaml>=6.0",
    "tomlkit>=0.13",
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
autoskill = "autoskill_local.cli:app"
autoskill-companion = "autoskill_local.companion:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autoskill_local"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"
