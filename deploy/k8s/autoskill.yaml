# AutoSkill on k3s. One API pod and one web pod in a namespace of their own; the outer reverse
# proxy points at the `autoskill-web` service.
#
# Two secrets are NOT here, create them once:
#   kubectl -n autoskill create secret generic autoskill-secrets \
#       --from-literal=secret-key="$(openssl rand -base64 48 | tr -d '\n')"
#   kubectl -n autoskill create secret generic autoskill-db \
#       --from-literal=database-url="postgresql+asyncpg://autoskill:<pw>@postgresql.tadamoo.svc.cluster.local:5432/autoskill"
#
# Single replica on purpose. The database is the cluster's PostgreSQL, but jobs still run inline and
# the event bus is in memory: correct for one process, wrong for two. A second replica would need
# Redis for the event bus (already in this cluster) - see deploy/README.md. The PVC still holds the
# content store and the llmswitch registry (its API keys), so it stays ReadWriteOnce with Recreate.
---
apiVersion: v1
kind: Namespace
metadata:
  name: autoskill
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: autoskill-data
  namespace: autoskill
spec:
  # The database, the content store, and the llmswitch registry with its API keys.
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoskill-api
  namespace: autoskill
  labels: { app: autoskill, component: api }
spec:
  replicas: 1
  strategy:
    # ReadWriteOnce on a single node: the old pod has to let go before the new one starts.
    type: Recreate
  selector:
    matchLabels: { app: autoskill, component: api }
  template:
    metadata:
      labels: { app: autoskill, component: api }
    spec:
      securityContext:
        fsGroup: 10001
      initContainers:
        - name: migrate
          image: autoskill/api:latest
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: { name: autoskill-config }
          env:
            - name: AUTOSKILL_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: autoskill-secrets, key: secret-key }
            - name: AUTOSKILL_DATABASE_URL
              valueFrom:
                secretKeyRef: { name: autoskill-db, key: database-url }
          volumeMounts:
            - { name: data, mountPath: /data }
      containers:
        - name: api
          image: autoskill/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8000 }
          envFrom:
            - configMapRef: { name: autoskill-config }
          env:
            - name: AUTOSKILL_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: autoskill-secrets, key: secret-key }
            - name: AUTOSKILL_DATABASE_URL
              valueFrom:
                secretKeyRef: { name: autoskill-db, key: database-url }
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            httpGet: { path: /api/v1/health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/v1/health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: autoskill-data }
---
apiVersion: v1
kind: Service
metadata:
  name: autoskill-api
  namespace: autoskill
spec:
  selector: { app: autoskill, component: api }
  ports:
    - { name: http, port: 8000, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoskill-web
  namespace: autoskill
  labels: { app: autoskill, component: web }
spec:
  replicas: 1
  selector:
    matchLabels: { app: autoskill, component: web }
  template:
    metadata:
      labels: { app: autoskill, component: web }
    spec:
      containers:
        - name: web
          image: autoskill/web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: autoskill-web
  namespace: autoskill
spec:
  # What the reverse proxy points at. Nginx Proxy Manager runs on the host network, so it reaches
  # this the way every other site on this node is reached: the node address on a fixed NodePort.
  type: NodePort
  selector: { app: autoskill, component: web }
  ports:
    - { name: http, port: 80, targetPort: http, nodePort: 30890 }
