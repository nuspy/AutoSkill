# /etc/nginx/sites-available/autoskill  (then: ln -s ... sites-enabled/ && nginx -t && systemctl reload nginx)
#
# HTTPS is the expected setup: agents download install bundles from /dl/ URLs that carry a capability
# token in the path, so the transport must be encrypted and those paths must not be logged.
# Get certificates with: certbot --nginx -d autoskill.example.com

server {
    listen 80;
    server_name autoskill.example.com;
    # certbot needs this for the HTTP-01 challenge
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name autoskill.example.com;
    ssl_certificate     /etc/letsencrypt/live/autoskill.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autoskill.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /opt/autoskill/frontend;
    index index.html;
    client_max_body_size 64m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # required for server-sent events
        proxy_read_timeout 3600s;
    }

    # install bundles and downloads reachable by agents without a login: the token is in the URL,
    # so keep these requests out of the access log
    location /dl/ {
        access_log off;
        proxy_pass http://127.0.0.1:8000/dl/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    location /git/ {
        access_log off;               # basic-auth credentials travel in these requests
        proxy_pass http://127.0.0.1:8000/git/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
