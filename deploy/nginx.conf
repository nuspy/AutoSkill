# /etc/nginx/sites-available/autoskill  (then: ln -s ... sites-enabled/ && nginx -t && systemctl reload nginx)
server {
    listen 80;
    server_name autoskill.example.com;
    root /opt/autoskill/frontend;
    index index.html;
    client_max_body_size 64m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # required for server-sent events
        proxy_read_timeout 3600s;
    }

    # install bundles and downloads reachable by agents without a login (token in the URL)
    location /dl/ {
        proxy_pass http://127.0.0.1:8000/dl/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    location /git/ {
        proxy_pass http://127.0.0.1:8000/git/;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
