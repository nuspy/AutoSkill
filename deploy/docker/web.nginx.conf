# Serves the SPA and forwards everything the API owns. TLS and the public hostname are the outer
# proxy's job; this one listens on plain 8080 inside the cluster.

upstream autoskill_api {
    # The Kubernetes service. A name, not an address: the address changes, the name does not.
    server autoskill-api:8000;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64m;

    # Behind another proxy, so the client address arrives in a header, not in the connection.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 10.42.0.0/16;
    set_real_ip_from 10.43.0.0/16;

    location /api/ {
        proxy_pass http://autoskill_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;          # required for server-sent events
        proxy_read_timeout 3600s;
    }

    # Install bundles agents fetch without a login: the capability token is in the path, so these
    # requests stay out of the access log.
    location /dl/ {
        access_log off;
        proxy_pass http://autoskill_api/dl/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 600s;
    }

    location /git/ {
        access_log off;               # basic-auth credentials travel in these requests
        proxy_pass http://autoskill_api/git/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 600s;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # The SPA owns its own routes: anything that is not a file is index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
